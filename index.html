<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter House | Ultimate POS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #333; margin: 0; padding: 10px; }
        .app-container { background: #f1f5f9; max-width: 1000px; margin: auto; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        
        header { background: #1e293b; color: #d4af37; padding: 15px; text-align: center; font-family: 'Cinzel'; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; overflow-y: auto; }
        @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } }

        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #reader { width: 100%; border-radius: 15px; background: #000; }
        
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .btn-start { background: #007aff; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-add { background: #34c759; color: white; border: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .total-box { font-size: 28px; font-weight: bold; text-align: right; padding: 15px; color: #1e293b; }
        .status { text-align: center; font-size: 12px; font-weight: bold; color: #ef4444; }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>CHAPTER HOUSE</h1></header>

    <div class="main-grid">
        <div class="card">
            <h3>📷 Scanner</h3>
            <div id="reader"></div>
            <div id="status" class="status">Scanner Ready. Click Start.</div>
            <button class="btn-start" onclick="startScanner()">START BACK CAMERA</button>
            <button class="btn-start" style="background:#5856d6;" onclick="startScannerFront()">START FRONT CAMERA</button>
            
            <hr>
            <h4>📦 Add to Stock</h4>
            <input type="text" id="inBC" placeholder="Barcode Number">
            <input type="text" id="inNM" placeholder="Item Name">
            <input type="number" id="inPR" placeholder="Price (Rs.)">
            <button class="btn-add" onclick="saveToStock()">SAVE ITEM</button>
            
            <div id="stockList" style="margin-top:10px; font-size: 12px;"></div>
        </div>

        <div class="card">
            <h3>🛒 Today's Bill</h3>
            <div style="height: 300px; overflow-y: auto;">
                <table id="billTable">
                    <thead><tr><th>Item</th><th>Price</th><th></th></tr></thead>
                    <tbody id="billBody"></tbody>
                </table>
            </div>
            <div class="total-box" id="totalDisplay">Rs. 0</div>
            <button class="btn-start" style="background:#ff9500;" onclick="window.print()">PRINT BILL</button>
            <button onclick="clearBill()" style="background:none; border:none; color:red; cursor:pointer;">Clear Bill</button>
        </div>
    </div>
</div>

<script>
    let stock = JSON.parse(localStorage.getItem('ch_stock')) || [];
    let currentBill = [];
    let scanner;

    // --- ස්කෑනර් එක පටන් ගැනීම ---
    function startScanner(cameraMode = "environment") {
        if(scanner) scanner.clear();
        
        scanner = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 150 } };

        scanner.start({ facingMode: cameraMode }, config, (decodedText) => {
            document.getElementById('status').innerText = "✅ SCANNED: " + decodedText;
            document.getElementById('status').style.color = "green";
            processItem(decodedText);
        }).catch(err => {
            document.getElementById('status').innerText = "⚠️ Error: " + err;
            console.error(err);
        });
    }

    function startScannerFront() { startScanner("user"); }

    function processItem(code) {
        const item = stock.find(i => i.bc === code);
        if(item) {
            currentBill.push(item);
            updateUI();
            // පොඩි vibration එකක් (Android වල පමණයි)
            if(navigator.vibrate) navigator.vibrate(100);
        } else {
            document.getElementById('status').innerText = "❌ Item Not Found: " + code;
            document.getElementById('status').style.color = "red";
        }
    }

    function saveToStock() {
        const bc = document.getElementById('inBC').value;
        const nm = document.getElementById('inNM').value;
        const pr = document.getElementById('inPR').value;
        if(!bc || !nm || !pr) return alert("Fill all fields!");
        
        stock.push({ bc, nm, pr: parseFloat(pr) });
        localStorage.setItem('ch_stock', JSON.stringify(stock));
        renderStock();
        document.getElementById('inBC').value=''; document.getElementById('inNM').value=''; document.getElementById('inPR').value='';
    }

    function renderStock() {
        const div = document.getElementById('stockList');
        div.innerHTML = "<b>Stock:</b> " + stock.map(i => i.nm).join(", ");
    }

    function updateUI() {
        const body = document.getElementById('billBody');
        body.innerHTML = '';
        let total = 0;
        currentBill.forEach((item, index) => {
            total += item.pr;
            body.innerHTML += `<tr><td>${item.nm}</td><td>${item.pr}</td><td><button onclick="removeItem(${index})">x</button></td></tr>`;
        });
        document.getElementById('totalDisplay').innerText = "Rs. " + total;
    }

    function removeItem(index) {
        currentBill.splice(index, 1);
        updateUI();
    }

    function clearBill() {
        currentBill = [];
        updateUI();
    }

    renderStock();
</script>
</body>
</html>
